<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="dashSpend: expense reimbursement for your team." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M10 9h8.2a4.8 4.8 0 0 1 0 9.6H13v4.4a1 1 0 0 1-2 0V10a1 1 0 0 1 1-1h-2zm3 2.4v4.8h5.2a2.4 2.4 0 0 0 0-4.8H13z' fill='white'/%3E%3C/svg%3E"
    />
    <title>dashSpend</title>
    <script>
      // Set the theme class before first paint to avoid a flash.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("dashspend.theme"); } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
